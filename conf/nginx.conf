location __PATH__ {

        #Client max body size to allow upload of ebook.
        #big number as audiobook may be quite big
        client_max_body_size 500M;

        #Proxy buffering is required for Kobo sync on large library
        proxy_busy_buffers_size   512k;
        proxy_buffers   4 512k;
        proxy_buffer_size   256k;

        proxy_pass				http://127.0.0.1:__PORT__;
        
        include proxy_params_with_auth;

        proxy_set_header	X-Script-Name		__PATH__;
        proxy_set_header	X-Remote-User		$http_ynh_user;
}

# CWA's logout only ends CWA's own session. Afterwards, send the browser to the
# YunoHost portal API logout so the SSO session is invalidated server-side too;
# it redirects back (referer_redirect) and SSOwat then shows the YunoHost login.
location = __PATH__/logout {
        include proxy_params_with_auth;

        proxy_pass				http://127.0.0.1:__PORT__;
        proxy_set_header	X-Script-Name		__PATH__;
        proxy_set_header	X-Remote-User		$http_ynh_user;
        proxy_redirect	~.*	https://$host/yunohost/portalapi/logout?referer_redirect;
}
