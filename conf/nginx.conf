location __PATH__ {

        #Client max body size to allow upload of ebook.
        #big number as audiobook may be quite big
        client_max_body_size 500M;

        #Proxy buffering is required for Kobo sync on large library
        proxy_busy_buffers_size   512k;
        proxy_buffers   4 512k;
        proxy_buffer_size   256k;

        proxy_pass				http://127.0.0.1:__PORT__;
        
        include proxy_params_with_auth;

        proxy_set_header	X-Script-Name		__PATH__;
        proxy_set_header	X-Remote-User		$http_ynh_user;
}

# CWA's logout only clears its own cookie. The YunoHost SSO cookie (yunohost.portal)
# would immediately log the user back in through the Ynh-User header, so expire it
# here for every domain scope the portal may have set it on: the current host, the
# host itself (as a domain cookie), and the portal's main domain (the portal sets
# Domain=.main.domain, and ssowat accepts it on subdomains while the portal API does not).
# Matches /logout when installed at /, and /books/logout for an install under /books.
location = __PATH__/logout {
        include proxy_params_with_auth;

        proxy_pass					http://127.0.0.1:__PORT__;
        proxy_set_header	Host			$host;
        proxy_set_header	X-Script-Name		__PATH__;
        proxy_set_header	X-Remote-User		$http_ynh_user;

        add_header Set-Cookie "yunohost.portal=; Path=/; Max-Age=0; Secure; HttpOnly" always;
        add_header Set-Cookie "yunohost.portal=; Domain=.$host; Path=/; Max-Age=0; Secure; HttpOnly" always;
        add_header Set-Cookie "yunohost.portal=; Domain=.__MAIN_DOMAIN__; Path=/; Max-Age=0; Secure; HttpOnly" always;
}
